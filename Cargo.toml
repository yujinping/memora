[package]
name = "memora"
version = "0.4.0"
edition = "2021"
authors = ["yujinping"]
description = "Memora (忆庐): 轻量自托管 AI 长期记忆服务 (MCP + SQLite)"
license = "MIT"

[dependencies]
axum = "0.8"
# 主动限制 HTTP 请求体字节数（边缘防护，与 normalize 的字段级上限构成双层）。
# 仅启用 `limit` 特性；tower-http 本就是 axum 的传递依赖，这里是显式声明以便直接引用
# `BodyLimitLayer`（axum 的 `DefaultBodyLimit::max` 只给自有提取器设默认上限，不限制嵌套服务）。
tower-http = { version = "0.6", default-features = false, features = ["limit"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
# TOML 配置解析。取代 dotenvy：`.env` 无类型、无嵌套、且未知键静默忽略，
# 正是「改了配置却没生效」的温床；TOML 可借 serde 拒绝未知键。
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# 项目 token 的随机源。只取系统熵，不引入 rand 生态（PRNG 状态与分布 API 此处无用）。
getrandom = "0.3"
# P4.2 自守护进程管理：setsid 脱离控制终端、kill(pid, 0) 存活探测、SIGTERM/SIGKILL。
# 这些在 std 中无安全封装（`CommandExt::pre_exec` 本身就是 unsafe），故直接绑定 libc；
# 纯 FFI 声明，无编译期成本。
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# MCP SDK。3.x 迭代较快，故锁定次版本（"3.3.0" 等价 ^3.3.0，不含 4.x）；
# 升级前请先跑 `cargo test routes::`（协议级端到端）与 `cargo test mcp::`（工具语义）。
rmcp = { version = "3.3.0", features = ["transport-streamable-http-server"] }
# 与 rmcp 的 schemars 依赖同源（1.x），用于工具入参 / 出参的 JSON Schema 推导
schemars = "1.2.2"
argon2 = "0.6.0"
# P4.3 交接 CLI：直连公网 HTTPS 的阻塞式客户端（docs/handoff-integration-design.md §5.4）。
# 选 ureq 而非 reqwest：CLI 是同步的，reqwest 会拉入整套 async 栈而此处用不到。
# default-features 关掉（不引 json/charset 等无关特性），只留 rustls 提供 TLS 与 WebPKI 根证书。
ureq = { version = "3", default-features = false, features = ["rustls"] }
# P4.3 交接 CLI 的列表时间列（Unix 秒 → yyyy-MM-dd HH:MM）。
# sea-orm 已带入 time 生态，这里只是把它提升为直接依赖；不开 parsing / macros。
time = { version = "0.3", default-features = false, features = ["std", "formatting", "local-offset"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
