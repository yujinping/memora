name: build

# 触发条件：tag v* 推送构建并发版；也可 workflow_dispatch 手动触发
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            cli_artifact: target/release/memora
            cli_target: ""
          - platform: macos-x64
            os: macos-latest
            cli_artifact: target/x86_64-apple-darwin/release/memora
            cli_target: x86_64-apple-darwin
          - platform: macos-arm64
            os: macos-latest
            cli_artifact: target/aarch64-apple-darwin/release/memora
            cli_target: aarch64-apple-darwin
          - platform: windows-x64
            os: windows-latest
            cli_artifact: target/release/memora.exe
            cli_target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # macOS 两种变体（x64 / arm64）都需要两个目标
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # 原生构建：linux / windows。SQLite 走 libsqlite3-sys bundled，无需系统库
      - name: Build CLI (release)
        if: matrix.cli_target == ''
        run: cargo build --release

      # macOS 专版：按矩阵目标架构构建
      - name: Build CLI (macOS 单架构)
        if: runner.os == 'macOS' && matrix.cli_target != ''
        run: cargo build --release --target ${{ matrix.cli_target }}

      # 以平台区分文件名的形式上传 CLI，避免发布时同名文件互相覆盖
      - name: Prepare CLI artifact
        shell: bash
        env:
          CLI_ARTIFACT: ${{ matrix.cli_artifact }}
          PLATFORM: ${{ matrix.platform }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          mkdir -p dist-cli
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$CLI_ARTIFACT" "dist-cli/memora-$PLATFORM.exe"
          else
            cp "$CLI_ARTIFACT" "dist-cli/memora-$PLATFORM"
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v5
        with:
          name: memora-cli-${{ matrix.platform }}
          path: dist-cli

  release:
    name: 发布 GitHub Release
    needs: build
    # 仅 tag 推送（v*）时创建 Release，push 分支只构建不发布
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # RELEASE_NOTES.md 缺失时给出占位说明，避免 body_path 指向不存在的文件
      - name: 准备发布说明
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "本版本由 CI 自动发布。发版前可在 RELEASE_NOTES.md 中补充详细说明。" > RELEASE_NOTES.md
          fi

      - name: 下载各平台构建产物
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: 展平产物目录
        run: |
          mkdir -p dist
          find artifacts -type f -print0 | xargs -0 -I{} mv -n {} dist/ || true

      - name: 创建 GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}