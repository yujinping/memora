<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memora (忆庐) 控制台</title>
<style>
  /* 主题：默认深色，跟随系统偏好切到浅色。两套变量同名，其余样式只引用变量，
     因此不需要写两遍规则。 */
  :root {
    --bg: #0f1117;
    --panel: #171b24;
    --panel-2: #1e2430;
    --border: #2a3242;
    --text: #e6e9ef;
    --muted: #98a2b6;
    --accent: #4c8dff;
    --accent-text: #ffffff;
    --danger: #ff6b6b;
    --ok: #3ddc97;
    --code-bg: #0b0e14;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fa;
      --panel: #ffffff;
      --panel-2: #f7f9fc;
      --border: #dde3ec;
      --text: #1b2130;
      --muted: #5c6880;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --danger: #d92d20;
      --ok: #067647;
      --code-bg: #0f172a;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 64px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  h2 { font-size: 15px; margin: 0 0 14px; letter-spacing: .2px; }
  a { color: var(--accent); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .hidden { display: none !important; }

  header.bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
    margin-bottom: 24px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .tag { color: var(--muted); font-size: 12px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  /* 登录 */
  .login-card { max-width: 380px; margin: 8vh auto 0; }
  .login-card h2 { margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
  input[type=text], input[type=password], select {
    width: 100%; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input::placeholder { color: var(--muted); }

  button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 9px 15px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    transition: filter .12s ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  button.danger { color: var(--danger); }
  button.link { background: none; border: none; color: var(--accent); padding: 4px 6px; }
  button.block { width: 100%; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row > .grow { flex: 1 1 220px; }
  .row > .shrink { flex: 0 0 160px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: none; }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.actions { white-space: nowrap; text-align: right; }

  .badge {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
  }

  /* 一次性 token 面板：创建成功后的视觉焦点 */
  .token-panel { border-color: var(--accent); }
  .token-panel .value {
    display: flex; gap: 8px; align-items: stretch; margin: 10px 0;
  }
  .token-panel .value code {
    flex: 1; min-width: 0; padding: 11px 12px; border-radius: 8px;
    background: var(--code-bg); color: #e6e9ef; font-size: 13px;
    overflow-x: auto; white-space: nowrap;
  }
  .warn { color: var(--danger); font-weight: 600; }

  .empty { color: var(--muted); padding: 18px 2px; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 10px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.3);
    max-width: 90vw; z-index: 10;
  }
  .toast.err { border-color: var(--danger); color: var(--danger); }
  .toast.ok { border-color: var(--ok); }

  /* 记忆浏览 */
  .mem-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 820px) { .mem-grid { grid-template-columns: 1fr; } }
  .entity { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; background: var(--panel-2); }
  .entity .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .entity .name { font-weight: 600; word-break: break-all; }
  ol.obs { margin: 8px 0 0; padding-left: 20px; }
  ol.obs li { margin-bottom: 4px; }
  ol.obs .oid { color: var(--muted); font-size: 11px; margin-right: 6px; }
  .rel { padding: 3px 0; word-break: break-all; }
  .rel .arw { color: var(--muted); margin: 0 6px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录视图 -->
  <section id="view-login" class="card login-card hidden">
    <h2>登录 Memora 控制台</h2>
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" type="text" autocomplete="username" value="admin">
    </div>
    <div class="field">
      <label for="password">口令</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="config.toml 中的 admin_password_hash 所对应的口令">
    </div>
    <button id="btn-login" class="primary block">登录</button>
    <p id="login-hint" class="small muted hidden" style="margin-bottom:0"></p>
  </section>

  <!-- 控制台视图 -->
  <div id="view-console" class="hidden">
    <header class="bar">
      <div class="brand">
        <h1>Memora (忆庐)</h1>
        <span class="tag">自托管 AI 长期记忆服务</span>
      </div>
      <div class="row" style="align-items:center">
        <span class="muted small">已登录：<span id="whoami" class="mono"></span></span>
        <button id="btn-logout">退出</button>
      </div>
    </header>

    <!-- 新建项目 -->
    <section class="card">
      <h2>新建项目</h2>
      <div class="row">
        <div class="grow">
          <label class="small muted" for="new-id" style="display:block;margin-bottom:6px">项目标识（留空则自动生成，如 p_3f9a1c2b4d5e）</label>
          <input id="new-id" type="text" placeholder="my-project — 仅限字母、数字、下划线、短横线">
        </div>
        <div class="shrink">
          <label class="small muted" for="new-backend" style="display:block;margin-bottom:6px">存储后端</label>
          <select id="new-backend">
            <option value="">使用默认</option>
            <option value="sqlite_file">sqlite_file</option>
            <option value="in_mem">in_mem（仅测试，进程退出即丢失）</option>
          </select>
        </div>
        <div>
          <button id="btn-create" class="primary">创建项目</button>
        </div>
      </div>
      <p class="small muted" style="margin-bottom:0">项目之间硬隔离：各自的 token 只能访问各自的记忆库。</p>
    </section>

    <!-- 一次性 token -->
    <section id="token-card" class="card token-panel hidden">
      <h2>项目「<span id="token-project" class="mono"></span>」已创建</h2>
      <p class="warn" style="margin-top:0">⚠️ 明文 token 仅显示一次。服务端只保存它的 SHA-256 摘要，关闭后无法再取回——丢失只能重建项目。</p>
      <div class="value">
        <code id="token-value"></code>
        <button id="btn-copy" class="primary">复制</button>
      </div>
      <p class="small muted" style="margin-bottom:0">
        把它填进 AI 客户端的 MCP 配置：URL 为 <span class="mono" id="mcp-url"></span>，请求头 <span class="mono">Authorization: Bearer &lt;token&gt;</span>。
      </p>
    </section>

    <!-- 项目列表 -->
    <section class="card">
      <h2>项目列表</h2>
      <div id="projects-host"><div class="empty">加载中…</div></div>
    </section>

    <!-- 记忆浏览 -->
    <section id="memory-card" class="card hidden">
      <h2>
        记忆浏览 · <span id="memory-project" class="mono"></span>
        <button id="btn-close-memory" class="link small">关闭</button>
      </h2>
      <div class="field">
        <input id="memory-filter" type="text" placeholder="按实体名 / 类型 / 观测内容过滤…">
      </div>
      <div id="memory-host"><div class="empty">加载中…</div></div>
    </section>
  </div>

</div>

<script>
"use strict";

// 控制台的全部取数都走这两个接口前缀；页面与它们同源，因此 Cookie 会自动携带。
const API = "/api/v1";

/** 当前视图里的用户名（登录成功后由服务端回传）。 */
let currentUser = null;

/* ---------------------------------------------------------------- 工具 */

/**
 * 创建元素。
 *
 * @intent 所有文本一律经 `textContent` 写入，**绝不使用 innerHTML 拼内容**：
 *         控制台展示的实体名、观测内容都来自 AI 客户端或用户写入的记忆库，
 *         属于不可信数据；用 innerHTML 渲染等于在自己的管理界面里开一个存储型 XSS。
 *         创建元素比拼字符串啰嗦，但这是不可协商的一条。
 */
function el(tag, opts = {}, children = []) {
  const node = document.createElement(tag);
  if (opts.class) node.className = opts.class;
  if (opts.text !== undefined) node.textContent = String(opts.text);
  if (opts.type) node.type = opts.type;
  if (opts.placeholder) node.placeholder = opts.placeholder;
  if (opts.value !== undefined) node.value = opts.value;
  if (opts.title) node.title = opts.title;
  if (opts.onClick) node.addEventListener("click", opts.onClick);
  for (const child of children) if (child) node.appendChild(child);
  return node;
}

function $(id) { return document.getElementById(id); }
function show(node) { node.classList.remove("hidden"); }
function hide(node) { node.classList.add("hidden"); }

let toastTimer = null;
/** 底部提示；`kind` 为 "ok" | "err"。 */
function toast(message, kind) {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();
  const node = el("div", { class: "toast" + (kind ? " " + kind : ""), text: message });
  document.body.appendChild(node);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.remove(), kind === "err" ? 6000 : 2600);
}

/**
 * 调用管理接口。
 *
 * @intent 失败时抛出带服务端 `detail` 的错误：本项目所有 4xx 响应都刻意带上可读原因
 *         （见 `reply` 模块），把它丢掉只留一句「请求失败」会让控制台比 curl 更难用。
 */
async function api(method, path, body) {
  const init = { method, credentials: "same-origin", headers: {} };
  if (body !== undefined) {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body);
  }
  const resp = await fetch(API + path, init);

  if (resp.status === 401 && currentUser !== null) {
    // 会话已过期或已被登出：回到登录视图，而不是让每个操作各自报一次 401。
    currentUser = null;
    hide($("view-console"));
    show($("view-login"));
    toast("会话已失效，请重新登录", "err");
  }

  let payload = null;
  const text = await resp.text();
  if (text) { try { payload = JSON.parse(text); } catch (_) { payload = null; } }

  if (!resp.ok) {
    const detail = (payload && (payload.detail || payload.error)) || ("HTTP " + resp.status);
    const error = new Error(detail);
    error.status = resp.status;
    throw error;
  }
  return payload;
}

/* ---------------------------------------------------------------- 登录 */

async function boot() {
  try {
    const status = await api("GET", "/session");
    if (status.authenticated) {
      currentUser = status.user || "admin";
      enterConsole();
    } else {
      prepareLogin(status);
    }
  } catch (err) {
    prepareLogin({ console_login_enabled: true });
    toast("无法连接服务：" + err.message, "err");
  }
}

function prepareLogin(status) {
  show($("view-login"));
  const hint = $("login-hint");
  if (status.console_login_enabled === false) {
    // 未配置口令时不给一个必然失败的登录框：直接说明该怎么修。
    hint.textContent = "本实例未配置控制台登录口令（config.toml 缺少 admin_password_hash），"
      + "请重新运行 `memora init --force` 生成，或手动设置后重启服务。";
    hint.classList.remove("muted");
    hint.classList.add("warn");
    hint.style.display = "block";
    $("btn-login").disabled = true;
  } else {
    hide(hint);
    $("btn-login").disabled = false;
  }
}

async function login() {
  const button = $("btn-login");
  button.disabled = true;
  button.textContent = "登录中…";
  try {
    const result = await api("POST", "/session", {
      username: $("username").value,
      password: $("password").value,
    });
    currentUser = result.user || "admin";
    $("password").value = "";
    enterConsole();
  } catch (err) {
    toast(err.status === 401 ? "用户名或口令不正确" : err.message, "err");
  } finally {
    button.disabled = false;
    button.textContent = "登录";
  }
}

async function logout() {
  try {
    await api("DELETE", "/session");
  } catch (_) {
    /* 登出失败也要回到登录视图：本地状态与服务端不一致时，重登一次即可收敛 */
  }
  currentUser = null;
  hide($("view-console"));
  show($("view-login"));
  toast("已退出", "ok");
}

function enterConsole() {
  hide($("view-login"));
  show($("view-console"));
  $("whoami").textContent = currentUser;
  $("mcp-url").textContent = location.origin + "/mcp";
  hide($("token-card"));
  hide($("memory-card"));
  loadProjects();
}

/* ------------------------------------------------------------ 项目列表 */

async function loadProjects() {
  const host = $("projects-host");
  host.replaceChildren(el("div", { class: "empty", text: "加载中…" }));

  let projects;
  try {
    projects = await api("GET", "/projects");
  } catch (err) {
    host.replaceChildren(el("div", { class: "empty", text: "加载失败：" + err.message }));
    return;
  }
  if (!Array.isArray(projects) || projects.length === 0) {
    host.replaceChildren(el("div", { class: "empty", text: "还没有项目。用上面的表单创建第一个。" }));
    return;
  }

  // 统计口径与 MCP 客户端看到的数据同源（服务端从 read_graph 派生），但接口是按项目
  // 提供的，故此处并发取一轮；项目数量是人工量级，不值得为此新增聚合接口。
  const stats = await Promise.all(projects.map(async (project) => {
    try {
      return await api("GET", "/projects/" + encodeURIComponent(project.project_id) + "/stats");
    } catch (_) {
      return null;
    }
  }));

  const table = el("table");
  const thead = el("thead");
  const headRow = el("tr");
  for (const [label, cls] of [["项目", ""], ["后端", ""], ["实体", "num"], ["关系", "num"], ["观测", "num"], ["操作", "actions"]]) {
    headRow.appendChild(el("th", { class: cls, text: label }));
  }
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = el("tbody");
  projects.forEach((project, index) => {
    const stat = stats[index];
    const row = el("tr");
    row.appendChild(el("td", { class: "mono", text: project.project_id }));
    row.appendChild(el("td", {}, [el("span", { class: "badge", text: project.backend })]));
    for (const key of ["entities", "relations", "observations"]) {
      row.appendChild(el("td", {
        class: "num",
        text: stat ? stat[key] : "—",
        title: stat ? "" : "统计不可用（后端未注册或数据不可读）",
      }));
    }
    row.appendChild(el("td", { class: "actions" }, [
      el("button", { class: "link", text: "查看记忆", onClick: () => openMemory(project.project_id) }),
      el("button", {
        class: "link small",
        text: "注销",
        onClick: () => removeProject(project.project_id),
      }),
    ]));
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  host.replaceChildren(table);
}

async function createProject() {
  const button = $("btn-create");
  const idInput = $("new-id");
  const backend = $("new-backend").value;

  button.disabled = true;
  button.textContent = "创建中…";
  try {
    const body = {};
    if (idInput.value.trim()) body.project_id = idInput.value.trim();
    if (backend) body.backend = backend;

    const created = await api("POST", "/projects", body);

    $("token-project").textContent = created.project_id;
    $("token-value").textContent = created.token;
    show($("token-card"));
    $("token-card").scrollIntoView({ behavior: "smooth", block: "nearest" });

    idInput.value = "";
    loadProjects();
  } catch (err) {
    toast(err.message, "err");
  } finally {
    button.disabled = false;
    button.textContent = "创建项目";
  }
}

async function removeProject(projectId) {
  if (!confirm("确认注销项目「" + projectId + "」？\n\n该项目库中的全部记忆（实体、关系、观测）将一并被物理删除，且无法恢复。")) {
    return;
  }
  try {
    const result = await api("DELETE", "/projects/" + encodeURIComponent(projectId));
    if (result && result.data_removed === false) {
      toast("登记已注销，但物理数据未能删除（后端不可用）——磁盘上可能仍有残留", "err");
    } else {
      toast("已注销项目「" + projectId + "」", "ok");
    }
    if ($("memory-project").textContent === projectId) hide($("memory-card"));
    loadProjects();
  } catch (err) {
    toast(err.message, "err");
  }
}

/* ------------------------------------------------------------ 记忆浏览 */

/** 当前正在浏览的图数据，供过滤时本地重绘，避免每敲一个字就打一次请求。 */
let currentGraph = null;

async function openMemory(projectId) {
  $("memory-project").textContent = projectId;
  $("memory-filter").value = "";
  show($("memory-card"));
  const host = $("memory-host");
  host.replaceChildren(el("div", { class: "empty", text: "加载中…" }));

  try {
    currentGraph = await api("GET", "/projects/" + encodeURIComponent(projectId) + "/graph");
  } catch (err) {
    currentGraph = null;
    host.replaceChildren(el("div", { class: "empty", text: "加载失败：" + err.message }));
    return;
  }
  renderGraph();
}

function renderGraph() {
  const host = $("memory-host");
  if (!currentGraph) return;

  const keyword = $("memory-filter").value.trim().toLowerCase();
  const entities = currentGraph.entities || [];
  const relations = currentGraph.relations || [];

  if (entities.length === 0 && relations.length === 0) {
    host.replaceChildren(el("div", { class: "empty", text: "这个项目还没有记忆。让 AI 客户端通过 MCP 写入后即可在此查看。" }));
    return;
  }

  const matches = (entity) => {
    if (!keyword) return true;
    if (entity.name.toLowerCase().includes(keyword)) return true;
    if ((entity.entity_type || "").toLowerCase().includes(keyword)) return true;
    return (entity.observations || []).some((obs) => (obs.content || "").toLowerCase().includes(keyword));
  };

  const left = el("div");
  const shown = entities.filter(matches);
  left.appendChild(el("h3", { class: "small muted", text: "实体 " + shown.length + " / " + entities.length }));
  if (shown.length === 0) {
    left.appendChild(el("div", { class: "empty", text: "没有匹配的实体。" }));
  }
  for (const entity of shown) {
    const head = el("div", { class: "head" }, [
      el("span", { class: "name", text: entity.name }),
      el("span", { class: "badge", text: entity.entity_type || "unknown" }),
    ]);
    const box = el("div", { class: "entity" }, [head]);
    if (entity.source) {
      box.appendChild(el("div", { class: "small muted", text: "来源：" + entity.source }));
    }
    const observations = entity.observations || [];
    if (observations.length === 0) {
      box.appendChild(el("div", { class: "small muted", text: "（无观测）" }));
    } else {
      const list = el("ol", { class: "obs" });
      for (const obs of observations) {
        const item = el("li");
        item.appendChild(el("span", { class: "oid mono", text: "#" + obs.id }));
        item.appendChild(document.createTextNode(obs.content || ""));
        if (obs.source) {
          item.appendChild(el("span", { class: "small muted", text: "  ← " + obs.source }));
        }
        list.appendChild(item);
      }
      box.appendChild(list);
    }
    left.appendChild(box);
  }

  const right = el("div");
  const shownRelations = relations.filter((relation) => {
    if (!keyword) return true;
    return [relation.from_name, relation.to_name, relation.relation_type]
      .some((value) => (value || "").toLowerCase().includes(keyword));
  });
  right.appendChild(el("h3", { class: "small muted", text: "关系 " + shownRelations.length + " / " + relations.length }));
  if (shownRelations.length === 0) {
    right.appendChild(el("div", { class: "empty", text: "没有匹配的关系。" }));
  }
  for (const relation of shownRelations) {
    right.appendChild(el("div", { class: "rel" }, [
      el("span", { class: "mono", text: relation.from_name }),
      el("span", { class: "arw", text: "—" + (relation.relation_type || "?") + "→" }),
      el("span", { class: "mono", text: relation.to_name }),
      el("span", { class: "small muted", text: "  #" + relation.id }),
    ]));
  }

  host.replaceChildren(el("div", { class: "mem-grid" }, [left, right]));
}

/* ---------------------------------------------------------------- 绑定 */

$("btn-login").addEventListener("click", login);
$("btn-logout").addEventListener("click", logout);
$("btn-create").addEventListener("click", createProject);
$("btn-close-memory").addEventListener("click", () => hide($("memory-card")));
$("memory-filter").addEventListener("input", renderGraph);

$("password").addEventListener("keydown", (event) => {
  if (event.key === "Enter") login();
});
$("new-id").addEventListener("keydown", (event) => {
  if (event.key === "Enter") createProject();
});

$("btn-copy").addEventListener("click", async () => {
  const token = $("token-value").textContent;
  try {
    await navigator.clipboard.writeText(token);
    toast("token 已复制到剪贴板", "ok");
  } catch (_) {
    // 非 HTTPS 或未授权时剪贴板 API 不可用：退回手工选中，并明确告知。
    const range = document.createRange();
    range.selectNodeContents($("token-value"));
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    toast("已选中 token，请按 Cmd/Ctrl+C 复制", "ok");
  }
});

boot();
</script>
</body>
</html>
